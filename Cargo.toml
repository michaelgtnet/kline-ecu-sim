[package]
name = "kline-ecu-sim"
version = "0.1.0"
edition = "2021"
authors = ["Michael G. <michael@autolink.pro>"]
description = "Automotive K-Line ECU Simulator for ISO 9141-2, ISO 14230 (KWP2000) and VW KWP1281"
license = "MIT"
readme = "README.md"
repository = "https://github.com/michaelgtnet/kline-ecu-sim"
keywords = ["obd2", "kline", "ecu-simulator", "kwp2000", "automotive"]
categories = ["embedded", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "io-util", "time", "sync"] }
bytes = "1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
